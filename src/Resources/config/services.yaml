services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Wexample\SymfonyTranslations\:
        resource: '../../{Command,Develop,Service,Twig}'
        tags: ['controller.service_arguments']

    Wexample\SymfonyTranslations\Develop\DevelopTranslationsTab:
        tags:
            - { name: 'wexample_symfony_loader.develop_tab' }

    # Override translation service.
    Wexample\SymfonyTranslations\Translation\Translator:
      decorates: translator
      arguments:
        - '@translator.default'
      public: false